[package]
name = "gw2remastered"
version = "0.1.0"
edition = "2024"
description = "GW2 Remastered texture runtime (msimg32.dll proxy)"
license = "MIT"

[lib]
name = "gw2remastered"
crate-type = ["rlib"]

[dependencies]
# The overlay language shared by every panel (core::i18n).
gw2enhanced-core = { path = "../../../core" }
retour = "0.3"
rayon = "1"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hudhook = { version = "=0.9.3", default-features = false, features = ["dx11"] }
anyhow = "1"
intel_tex_2 = "0.4"
texture2ddecoder = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
