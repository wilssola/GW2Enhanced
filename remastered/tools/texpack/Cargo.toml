[package]
name = "texpack"
version = "0.1.0"
edition = "2024"
description = "Upscaled PNG -> game-ready DDS (DXT1/DXT5, full mip chain) + pack index"
license = "MIT"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
intel_tex_2 = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
