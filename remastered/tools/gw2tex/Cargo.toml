[package]
name = "gw2tex"
version = "0.1.0"
edition = "2024"
description = "Read-only Gw2.dat texture tooling for GW2 Remastered"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
debug = false
