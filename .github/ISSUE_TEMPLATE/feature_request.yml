name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: feature
    attributes:
      label: Area
      options: [Translation, HD Textures, Graphics, Installer / launcher, Website, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: markdown
    attributes:
      value: The mod only changes how the game looks and reads. Ideas that automate gameplay or give an advantage in play are out of scope.
