# Backend (Cloudflare Worker): tests on every change, automatic deploy from main.
#
# Deploy needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token of the "GW2Enhanced" account with Workers Scripts:Edit, D1:Edit and
#                          Workers R2 Storage:Edit (template "Edit Cloudflare Workers" + D1 Edit)
#   CLOUDFLARE_ACCOUNT_ID  d6a80bf381ccfa399e11f6ba29667c5a (also pinned in backend/wrangler.toml)
# Actions are pinned to commit SHAs and the deploy job has no build cache: it holds the Cloudflare token.
# The Worker's own secrets (NVIDIA_API_KEY, TURNSTILE_SECRET, ...) live in Cloudflare (`wrangler secret put`); the daily
# release build and backup run in backend-jobs.yml.
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false # never cut a deploy or a migration in half

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: backend
      - name: Tests (Worker logic on the host)
        run: cargo test --locked
      - name: Builds for the Worker (wasm32)
        run: cargo check --locked --target wasm32-unknown-unknown

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Wrangler is the version pinned in backend/package.json (bun.lock).
      - name: Install wrangler
        run: bun install --frozen-lockfile
      # Migrations first: a new Worker may need the new schema; a migration is written so the old Worker still works.
      - name: Apply D1 migrations
        run: bun run migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy (wrangler runs worker-build)
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
