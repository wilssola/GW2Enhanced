[package]
name = "gw2enhanced-core"
version = "0.1.0"
edition = "2024"
description = "Shared plumbing of GW2 Enhanced: locating game code across patches, feature health registry"
license = "MIT"

[dependencies]
# Signed updates: SHA256SUMS.txt carries an ed25519 signature (see src/signed.rs, examples/sign_sums.rs).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast", "zeroize"] }
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_LibraryLoader"] }

[dev-dependencies]
getrandom = "0.2"
