[package]
name = "gw2enhanced"
version = "0.1.0"
edition = "2024"
description = "GW2 Enhanced: one mod (translation, HD textures, graphics) behind the msimg32.dll proxy"
license = "MIT"

# Which mods go into msimg32.dll. All three by default; build one alone with e.g.
# `cargo build --release -p gw2enhanced --no-default-features --features graphics` (or the aliases in .cargo/config.toml).
[features]
default = ["translation", "textures", "graphics"]
translation = ["dep:gw2translated"]
textures = ["dep:gw2remastered"]
graphics = ["dep:gw2graphics"]

[lib]
name = "msimg32"
crate-type = ["cdylib"]

[dependencies]
gw2enhanced-core = { path = "../core" }
gw2remastered = { path = "../remastered/native/runtime", optional = true }
gw2graphics = { path = "../graphics/runtime", optional = true }
gw2translated = { path = "../translated", optional = true }
hudhook = { version = "=0.9.3", default-features = false, features = ["dx11"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The auto-updater (src/update.rs), built in whatever mods are: the same stack as Zapive's, blocking (no tokio).
# self_update gives the version ordering; the check, download, checksum and install are ours.
self_update = { version = "1.3.0", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate", "ureq", "github"] }
ureq = "3"
sha2 = "0.10"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
