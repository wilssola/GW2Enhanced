# GW2 Enhanced backend (Rust, workers-rs). See README.md for deploy steps.
name = "gw2enhanced"
main = "build/index.js"
compatibility_date = "2026-10-01"
# The Cloudflare account (deploys never go to another account by accident).
account_id = "d6a80bf381ccfa399e11f6ba29667c5a"

# Served at https://gw2enhanced.wilssola.dev (custom domain, zone on the account) and at
# https://gw2enhanced.wilssola.workers.dev (worker `gw2enhanced` on the account subdomain `wilssola`).
workers_dev = true
routes = [{ pattern = "gw2enhanced.wilssola.dev", custom_domain = true }]

[build]
command = "cargo install -q worker-build --version ~0.8 && worker-build --release"

# Scheduled job (must match CRON_REVIEW in src/app/mod.rs):
#   */5 * * * *  review queue (AI + reporter agreement), stats refresh
# The daily dictionary release build and D1 -> R2 backup run in GitHub Actions
# (.github/workflows/backend-jobs.yml, src/bin/jobs.rs), so the Worker fits the Free plan.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[vars]
LANGS = "pt-BR"
NIM_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1"
NIM_URL = "https://integrate.api.nvidia.com/v1/chat/completions"
REVIEW_BATCH = "200"
TURNSTILE_SITE_KEY = "0x4AAAAAAGCjx51hXMttecDA"
# Optional: only accept Turnstile tokens issued for this hostname.
TURNSTILE_HOSTNAME = "gw2enhanced.wilssola.dev"
DOWNLOAD_URL = "https://github.com/wilssola/GW2Enhanced/releases/latest/download"

[[d1_databases]]
binding = "DB"
database_name = "gw2enhanced"
database_id = "a3eb4cd3-c55f-4521-a5b7-4a6326740b13"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "gw2enhanced"

# Secrets (wrangler secret put NAME), never in this file:
#   NVIDIA_API_KEY, TURNSTILE_SECRET, RELEASE_SIGNING_KEY, ADMIN_TOKEN, IP_SALT
