[package]
name = "gw2translated-backend"
version = "0.1.0"
edition = "2024"
description = "GW2 Enhanced backend: Cloudflare Worker (D1 + R2) for contributions, votes and signed dictionary releases"
license = "MIT"
publish = false

# Standalone workspace: it targets wasm32, unlike the mods.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast", "zeroize"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Query builder: every statement is built as (SQL with ? placeholders, values).
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "derive"] }

[features]
# The daily jobs binary (src/bin/jobs.rs), run by GitHub Actions on the host.
jobs = ["dep:ureq"]

[[bin]]
name = "jobs"
required-features = ["jobs"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", optional = true, features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9", features = ["d1"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
getrandom = "0.2"

# Host tests run every built statement against the migration in SQLite.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
