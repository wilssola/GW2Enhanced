[package]
name = "gw2translated-translator"
version = "0.1.0"
edition = "2024"
description = "Local translation from English (CTranslate2 + Argos/OPUS-MT models) for GW2 Translated"
license = "MIT"
build = "build.rs"

[dependencies]
# `system`: links the official CTranslate2 DLL fetched by scripts/fetch-ctranslate2.ps1
# (fast CPU kernels + CUDA). `cuda-dynamic-loading`: cuBLAS is only loaded when a
# CUDA device is requested (and keeps ct2rs from linking cuBLAS statically).
ct2rs = { version = "0.11", default-features = false, features = ["sentencepiece", "system", "cuda-dynamic-loading"] }
# DirectML mode. `load-dynamic`: onnxruntime.dll is only loaded when that mode is
# requested (scripts/fetch-directml.ps1). Pinned: this version talks to ONNX
# Runtime 1.24, the last one with a DirectML build on NuGet.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
serde_json = "1"
anyhow = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
