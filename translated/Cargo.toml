[package]
name = "gw2translated"
version = "0.1.0"
edition = "2024"
description = "Plug-and-play translation of Guild Wars 2 (version.dll proxy)"
license = "MIT"

[lib]
name = "gw2translated"
crate-type = ["rlib"]

[dependencies]
# The overlay language shared by every panel (core::i18n).
gw2enhanced-core = { path = "../core" }
hudhook = { version = "0.9", default-features = false, features = ["dx11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
retour = "0.3"
# Dictionary releases (src/release.rs): ed25519-signed manifest, gzip files checked by SHA-256.
sha2 = "0.10"
flate2 = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
