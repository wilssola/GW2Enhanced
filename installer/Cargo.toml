[package]
name = "gw2translated-installer"
version = "0.1.0"
edition = "2024"
description = "GW2 Translated installer"
license = "MIT"

[[bin]]
name = "GW2Translated-Installer"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
tempfile = "3"
